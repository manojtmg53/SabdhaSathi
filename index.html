<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SabdhaSathi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<<header class="top-bar">

    <div class="app-info">
        <h1>SabdhaSathi</h1>
        <p>Offline Nepali Dictionary</p>
    </div>

    <div class="top-actions">

        <button class="icon-btn" id="themeBtn">
            <span class="material-symbols-rounded">dark_mode</span>
        </button>

        <button class="icon-btn">
            <span class="material-symbols-rounded">settings</span>
        </button>

    </div>

</header>
    <main id="app">

<section class="search-section">

    <div class="search-box">

        <span class="material-symbols-rounded search-icon">
            search
        </span>

        <input
            id="searchInput"
            type="search"
            placeholder="शब्द खोज्नुहोस्..."
            autocomplete="off">

        <button id="clearBtn" class="clear-btn">
            <span class="material-symbols-rounded">
                close
            </span>
        </button>

    </div>

</section>

    <section id="results">
        <p class="welcome">
            स्वागत छ 👋<br>
            खोजी सुरु गर्न माथिको बाकसमा शब्द टाइप गर्नुहोस्।
        </p>
    </section>
    <section id="wordDetails" class="word-details hidden"></section>

</main>

<script src="js/dictionary.js"></script>
<script src="js/search.js"></script>
<script src="js/ui.js"></script>
<script src="js/favorites.js"></script>
<script src="js/history.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>

<nav class="bottom-nav">

    <button class="nav-item active">
        <span class="material-symbols-rounded">home</span>
        <span>Home</span>
    </button>

    <button class="nav-item">
        <span class="material-symbols-rounded">favorite</span>
        <span>Favorites</span>
    </button>

    <button class="nav-item">
        <span class="material-symbols-rounded">settings</span>
        <span>Settings</span>
    </button>

</nav>
</body>
</html>
